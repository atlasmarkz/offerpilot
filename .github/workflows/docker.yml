name: docker-image

# 构建网页端镜像并推到 GitHub Container Registry（ghcr.io/<owner>/offerpilot-web）。
# 服务器内存小（2G 以下）时在服务器上构建容易内存不够，可以用这里构建好的镜像：
# 在 deploy/.env 里设 WEB_IMAGE=ghcr.io/<owner>/offerpilot-web:latest，服务器上 docker login ghcr.io 后 docker compose pull。
# 只在手动触发或打版本标签（v1.2.3）时推送镜像；PR 改到网页端或部署文件时只构建、不推送，用来检查镜像能不能建出来。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - apps/web/**
      - packages/shared/**
      - package-lock.json

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/offerpilot-web
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          # PR 上只构建；构建好后再起一个容器，确认健康检查能通过
          load: ${{ github.event_name == 'pull_request' }}
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name web -p 3000:3000 ghcr.io/${{ github.repository_owner }}/offerpilot-web:latest
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 2; done
          docker logs web; exit 1
